<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh Yadav - Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Clicker+Script&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/skin/color.css" id="skin-color">
</head>

<body class="dark">
    <!-- Main Container Start -->
    <div class="main-container">
        <!-- ==== Aside Sidebar Start ==== -->
        <div class="aside">
            <div class="logo">
                <a href="#">
                    <span class="bracket-tr"></span>
                    <span class="logo-text">Harsh</span>
                    <span class="bracket-bl"></span>
                </a>
            </div>
            <div class="nav-toggler">
                <span></span>
            </div>
            <ul class="nav">
                <li><a href="#home" class="active"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="#about"><i class="fa fa-user"></i> About</a></li>
                <li><a href="#services"><i class="fa fa-list"></i> Services</a></li>
                <li><a href="#portfolio"><i class="fa fa-briefcase"></i> Portfolio</a></li>
                <li><a href="#contact"><i class="fa fa-comments"></i> Contact</a></li>
            </ul>
        </div>
        <!-- ==== Aside Sidebar End ==== -->

        <!-- === Main Content Start === -->
        <div class="main-content">
            <!-- === Home Section Start === -->
            <section class="home section" id="home">
                <div class="container">
                    <div class="row align-items-center">
                        <div class="home-info pad-15">
                            <h3 class="hello">Hello, my name is <span class="name">Harsh Yadav</span></h3>
                            <h3 class="my-profession">I'm a <span class="typing">Graphic</span><span class="typed-cursor">|</span></h3>
                            <p>
                                I'm a web Designer with extensive experience for over 10 years. My expertise is to create and website design, graphic design, and many more...
                            </p>
                            <a href="#about" class="btn hire-me">More About Me</a>
                        </div>
                        <div class="home-img pad-15">
                            <div class="img-frame">
                                <span class="frame-corner top-left"></span>
                                <img src="assets/images/profile.jpg" alt="Harsh Yadav Profile">
                                <span class="frame-corner bottom-right"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <!-- === Home Section End === -->
        </div>
        <!-- === Main Content End === -->
    </div>
    <!-- Main Container End -->

    <!-- ==== Style Switcher Start ==== -->
    <div class="style-switcher">
        <div class="style-switcher-toggler s-icon" title="Theme Colors">
            <i class="fas fa-cog fa-spin"></i>
        </div>
        <div class="day-night s-icon" title="Toggle Light/Dark">
            <i class="fas fa-sun"></i>
        </div>
        <h4>Theme Colors</h4>
        <div class="colors">
            <span class="color-1" onclick="setActiveStyle('color-1')"></span>
            <span class="color-2" onclick="setActiveStyle('color-2')"></span>
            <span class="color-3" onclick="setActiveStyle('color-3')"></span>
            <span class="color-4" onclick="setActiveStyle('color-4')"></span>
            <span class="color-5" onclick="setActiveStyle('color-5')"></span>
        </div>
    </div>
    <!-- ==== Style Switcher End ==== -->

    <!-- JS FILES -->
    <script src="assets/script.js"></script>
</body>

</html>
